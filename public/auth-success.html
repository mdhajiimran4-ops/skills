<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing you in… — SkillBridge</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <p>Signing you in…</p>
</div>
<script src="/js/shared.js"></script>
<script>
  // Google OAuth callback redirects here with #token=...&role=...
  const hash = new URLSearchParams(window.location.hash.replace('#', '?'));
  const token = hash.get('token');
  const role = hash.get('role');

  if (!token) {
    window.location.href = '/login.html?error=google_failed';
  } else {
    fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(data => {
        setSession(token, data.user);
        window.location.href = `/${data.user.role}.html`;
      })
      .catch(() => window.location.href = '/login.html?error=google_failed');
  }
</script>
</body>
</html>
